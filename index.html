<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f8fafc" />

    <title>My Study</title>

    <link rel="stylesheet" href="./css/style.css?v=9" />
    <link rel="stylesheet" href="./css/reader.css?v=9" />
    <link rel="stylesheet" href="./css/audio.css?v=7" />
    <link rel="stylesheet" href="./css/settings.css?v=1" />
    <link rel="stylesheet" href="./css/conversation.css?v=3" />
    <link rel="stylesheet" href="./css/theory.css?v=1" />
      <link rel="stylesheet" href="./css/grammar.css?v=1" />
  </head>

  <body>
    <!-- Header -->

    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="#/"> My Study </a>

        <nav
          id="study-actions"
          class="header-actions"
          aria-label="학습 메뉴"
          hidden
        >
          <!-- Content editor -->

          <a
            class="editor-shortcut"
            href="./tools/editor.html"
            target="_blank"
            rel="noopener"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m16 4 4 4" />
              <path d="m14 6 4-4 4 4-12 12-5 1 1-5Z" />
            </svg>

            <span>콘텐츠 등록</span>
          </a>

          <!-- Settings -->

          <button
            id="settings-button"
            class="settings-button"
            type="button"
            aria-label="학습 설정"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18
            a2 2 0 0 1-1 1.73l-.43.25
            a2 2 0 0 1-2 0l-.15-.08
            a2 2 0 0 0-2.73.73l-.22.38
            a2 2 0 0 0 .73 2.73l.15.1
            a2 2 0 0 1 1 1.72v.51
            a2 2 0 0 1-1 1.74l-.15.09
            a2 2 0 0 0-.73 2.73l.22.38
            a2 2 0 0 0 2.73.73l.15-.08
            a2 2 0 0 1 2 0l.43.25
            a2 2 0 0 1 1 1.73V20
            a2 2 0 0 0 2 2h.44
            a2 2 0 0 0 2-2v-.18
            a2 2 0 0 1 1-1.73l.43-.25
            a2 2 0 0 1 2 0l.15.08
            a2 2 0 0 0 2.73-.73l.22-.38
            a2 2 0 0 0-.73-2.73l-.15-.09
            a2 2 0 0 1-1-1.74v-.51
            a2 2 0 0 1 1-1.74l.15-.09
            a2 2 0 0 0 .73-2.73l-.22-.38
            a2 2 0 0 0-2.73-.73l-.15.08
            a2 2 0 0 1-2 0l-.43-.25
            a2 2 0 0 1-1-1.73V4
            a2 2 0 0 0-2-2z"
              />

              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="lock-button" type="button" class="editor-shortcut">
            잠금
          </button>
        </nav>
      </div>
    </header>

    <!-- Main -->

    <main id="app" class="container">
      <p class="empty-state">학습 자료를 불러오는 중입니다.</p>
    </main>

    <!-- Footer -->

    <footer class="app-footer">My Study · Personal Learning Space</footer>

    <!-- Settings bottom sheet -->

    <dialog
      id="settings-dialog"
      class="settings-sheet"
      aria-labelledby="settings-title"
    >
      <div class="settings-content">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="settings-header">
          <h2 id="settings-title">학습 설정</h2>

          <button
            id="settings-close"
            class="sheet-close"
            type="button"
            aria-label="닫기"
          >
            ×
          </button>
        </div>

        <form id="settings-form">
          <!-- English TTS -->

          <section class="settings-section">
            <h3>영어 음성</h3>

            <div class="settings-row">
              <label for="accent">영어 발음</label>

              <select id="accent" name="accent">
                <option value="en-US">미국식 영어</option>
                <option value="en-GB">영국식 영어</option>
                <option value="en-AU">호주식 영어</option>
              </select>
            </div>

            <fieldset class="settings-fieldset">
              <legend>TTS 읽기 속도</legend>

              <div class="settings-options">
                <label>
                  <input type="radio" name="ttsRate" value="0.8" />
                  <span>×0.8</span>
                </label>

                <label>
                  <input type="radio" name="ttsRate" value="1" />
                  <span>×1</span>
                </label>

                <label>
                  <input type="radio" name="ttsRate" value="1.2" />
                  <span>×1.2</span>
                </label>
              </div>
            </fieldset>
          </section>

          <!-- Vocabulary audio -->

          <section class="settings-section">
            <h3>단어 연속 듣기</h3>

            <div class="settings-row">
              <label for="word-repeat">단어별 반복 횟수</label>

              <select id="word-repeat" name="wordRepeat">
                <option value="1">1회</option>
                <option value="2">2회</option>
                <option value="3">3회</option>
                <option value="5">5회</option>
              </select>
            </div>

            <div class="settings-row">
              <label for="word-interval">단어 사이 간격</label>

              <select id="word-interval" name="wordInterval">
                <option value="0">0초</option>
                <option value="1">1초</option>
                <option value="2">2초</option>
                <option value="3">3초</option>
                <option value="5">5초</option>
              </select>
            </div>

            <div class="settings-preview">
              <p class="muted">연속 듣기 순서</p>

              <p id="preview-word-first" lang="en">journey</p>

              <p id="preview-interval" class="muted">↓ 2초 대기</p>

              <p id="preview-word-second" lang="en">discover</p>
            </div>
          </section>

          <!-- Reading settings -->

          <section class="settings-section">
            <h3>화면 설정</h3>

            <fieldset class="settings-fieldset">
              <legend>본문 글자 크기</legend>

              <div class="settings-options">
                <label>
                  <input type="radio" name="fontOffset" value="-2" />
                  <span>작게</span>
                </label>

                <label>
                  <input type="radio" name="fontOffset" value="0" />
                  <span>기본</span>
                </label>

                <label>
                  <input type="radio" name="fontOffset" value="4" />
                  <span>크게</span>
                </label>

                <label>
                  <input type="radio" name="fontOffset" value="8" />
                  <span>아주 크게</span>
                </label>
              </div>
            </fieldset>

            <div class="settings-preview">
              <p class="sentence-en" lang="en">
                Life is a
                <span class="word-highlight">journey</span>.
              </p>

              <p class="sentence-ko">인생은 하나의 여정이다.</p>
            </div>
          </section>

          <!-- Actions -->

          <div class="settings-actions">
            <button id="settings-reset" class="settings-action" type="button">
              기본값으로 초기화
            </button>

            <button
              id="settings-done"
              class="settings-action primary"
              type="button"
            >
              완료
            </button>
          </div>

          <p id="settings-status" class="settings-status" role="status">
            변경 사항은 자동으로 저장됩니다.
          </p>
        </form>
      </div>
    </dialog>

    <script type="module" src="./js/settings.js"></script>
    <script type="module" src="./js/app.js?v=2"></script>
  </body>
</html>
