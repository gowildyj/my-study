<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f8fafc" />

    <title>학습 콘텐츠 등록 | Study</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/editor.css" />
  </head>

  <body>
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="../index.html">콘텐츠 등록</a>

        <a class="editor-button" href="../index.html"> 학습하기 </a>
      </div>
    </header>

    <main class="container editor-container">
      <div class="editor-import">
        <label class="editor-button import-button">
          기존 JSON 불러오기

          <input id="import-file" type="file" accept=".json,application/json" />
        </label>
      </div>

      <form id="editor-form" class="editor-form">
        <!-- Basic information -->

        <section class="editor-card">
          <h2>기본 정보</h2>

          <div class="editor-grid">
            <div class="editor-field">
              <label>과목</label>
              <input id="subject-id" value="college-english" required pattern="[a-z0-9-]+" spellcheck="false" />
              <p class="editor-hint">subjects.json의 id (예: french)</p>
            </div>

            <div class="editor-field">
              <label for="unit">단원</label>
              <select id="unit" required></select>
            </div>
          </div>

          <div class="editor-field">
            <label for="title">본문 제목</label>

            <input
              id="title"
              type="text"
              placeholder="영어 본문 제목"
              required
            />
          </div>

          <div class="editor-field">
            <label for="audio-path">오디오 경로</label>

            <input id="audio-path" type="text" spellcheck="false" />

            <p class="editor-hint">오디오가 없는 단원은 비워두세요.</p>
          </div>
        </section>

        <!-- English text -->

        <section class="editor-card">
          <div class="editor-section-heading">
            <h2>영어 본문</h2>
            <span id="english-count" class="editor-count">0문장</span>
          </div>

          <p class="editor-hint">
            한 문장씩 줄바꿈하고, 문단 사이는 빈 줄로 구분하세요.
          </p>

          <textarea
            id="english"
            lang="en"
            rows="12"
            spellcheck="false"
            placeholder="Life is a journey full of new experiences."
          ></textarea>
        </section>

        <!-- Korean translation -->

        <section class="editor-card">
          <div class="editor-section-heading">
            <h2>한국어 번역</h2>
            <span id="korean-count" class="editor-count">0문장</span>
          </div>

          <p class="editor-hint">
            영어 본문과 동일한 순서로 한 문장씩 입력하세요.
          </p>

          <textarea
            id="korean"
            rows="12"
            placeholder="인생은 새로운 경험으로 가득한 여정이다."
          ></textarea>
        </section>

        <!-- Vocabulary -->

        <section class="editor-card">
          <div class="editor-section-heading">
            <h2>단어장</h2>
            <span id="word-count" class="editor-count">0개</span>
          </div>

          <p class="editor-hint">영어 | 한국어 형식으로 한 줄씩 입력하세요.</p>

          <textarea
            id="words"
            rows="12"
            spellcheck="false"
            placeholder="journey | 여행, 여정
discover | 발견하다
experience | 경험"
          ></textarea>
        </section>

        <button class="editor-button primary" type="submit">
          본문 및 단어 자동 연결
        </button>
      </form>

      <p id="editor-status" class="editor-status" role="status"></p>

      <!-- Preview and manual linking -->

      <section id="preview-section" class="editor-card" hidden>
        <div class="editor-section-heading">
          <h2>본문 미리보기</h2>
          <span id="link-count" class="editor-count"></span>
        </div>

        <p class="editor-hint">
          파란색 단어를 누르면 연결을 해제합니다. 본문에서 표현을 선택하여 직접
          연결할 수도 있습니다.
        </p>

        <div id="preview-list"></div>

        <div class="editor-actions">
          <button id="copy-json" class="editor-button" type="button">
            JSON 복사
          </button>

          <button
            id="download-json"
            class="editor-button primary"
            type="button"
          >
            JSON 다운로드
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">Study · 콘텐츠 등록 도구</footer>

    <script type="module" src="./editor.js"></script>
  </body>
</html>
